<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strona jquery</title>
    <style>
        #kwadrat { width: 200px; height: 200px; background: red; }
    </style>
    <script src="https://code.jquery.com/jquery-4.0.0.min.js" integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous"></script>
    <script>
        $(function(){
            let liczbaKlikniec = 1;

            $("#kwadrat").click(function(){
                $("#komunikat").text(liczbaKlikniec);
                liczbaKlikniec++;
            });

            $("#naKoniec").click(function(){
                let produkt = $("#produkt").val();

                if(produkt != "") {
                    $("#lista").append("<li>" + produkt + "</li>");
                    $("li").last().css({
                        "color": "blue",
                        "font-weight": "bold"
                    });
                    $("#produkt").val("");
                }

            });

            $("#naPoczatek").click(function(){
                let produkt = $("#produkt").val();

                if(produkt != "") {
                    $("#lista").prepend("<li>" + produkt + "</li>");
                    $("li").first().css({
                        "color": "green",
                        "font-weight": "bold"
                    });
                    $("#produkt").val("");
                }
            });
        });
    </script>
</head>
<body>
    <div id="kwadrat"></div>
    <p id="komunikat">Nie kliknięto.</p>

    <ul id="lista">
        <li>Chleb</li>
        <li>Mleko</li>
    </ul>
    
    <input type="text" id="produkt" placeholder="Nazwa produktu">
    <button id="naKoniec">Dodaj na koniec</button>
    <button id="naPoczatek">Dodaj na początek</button>
</body>
</html>
