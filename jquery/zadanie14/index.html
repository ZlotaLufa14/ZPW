<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strona jquery</title>
    
    <script src="https://code.jquery.com/jquery-4.0.0.min.js" integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous"></script>
    <script>
        $(function(){

            $("#kolor").change(function() {
                $("body").css("background-color", $(this).val())
            })

            $("#wyswietl").text("Do zapłaty: " + $("#pizza").val() + " zł")
            $("#pizza").change(function() {
                $("#wyswietl").text("Do zapłaty: " + $(this).val() + " zł")
            })

            $("#newsletter").change(function() {
                if($(this).is(":checked")) {
                    $("#stan").text("Zapisano nas do newsletter")
                } else {
                    $("#stan").text("Wypisano nas do newsletter")
                }
            })

            $("#regulamin").change(function() {
                if($(this).is(":checked")) {
                    $("#zarejestruj").prop("disabled", false)
                } else {
                    $("#zarejestruj").prop("disabled", true)
                }
                // $("#zarejestruj").prop("disabled", $(this).is(":checked"))
            })

            $("#tekst").on("input", function() {
                $("#podglad").text($(this).val())
            })

            $("#poletekstowe").on("input", function() {
                let liczba = (100 - $(this).val().length)

                $("#licznik").text("Pozostało " + liczba + " znaków")
                if(liczba <= 10) {
                    $("#licznik").css("color", "red")
                } else {
                    $("#licznik").css("color", "black")
                }
            })
            
        });
    </script>
</head>
<body>
    <select id="kolor">
        <option value="white">Biały</option>
        <option value="yellow">Żółty</option>
        <option value="lightblue">Niebieski</option>
    </select>

    <hr>

    <select id="pizza">
        <option value="20">Mała (20zł)</option>
        <option value="30">Średnia (30zł)</option>
        <option value="40">Duża (40zł)</option>
    </select>
    <p id="wyswietl"></p>

    <hr>

    <input type="checkbox" id="newsletter"> Chcę newsletter
    <p id="stan"></p>

    <hr>

    <input type="checkbox" id="regulamin"> Akceptuję regulamin
    <button id="zarejestruj" disabled>Zarejestruj</button>

    <hr>
    
    <input type="text" id="tekst">
    <p>Podgląd: <span id="podglad"></span></p>

    <hr> 

    <textarea id="poletekstowe" maxlength="100"> </textarea>
    <p id="licznik">Pozostało 100 znaków</p>
</body>
</html>
